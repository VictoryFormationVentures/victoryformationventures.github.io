<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>Transaction Report · Victory Formation Ventures</title>
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Mulish:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    :root {
      --paper:        #ffffff;
      --ink:          #111;
      --ink-muted:    #555;
      --ink-soft:     #888;
      --rule:         #d5d5d5;
      --rule-light:   #eee;
      --band:         #f5f2ec;
      --accent:       #eae2d3;
      --ok:           #4a7548;
      --warn:         #a4720d;
      --err:          #a4291d;

      --font-body:    'Mulish', 'Helvetica Neue', Arial, sans-serif;
      --font-display: 'Aboreto', 'Cormorant Garamond', serif;
      --font-ui:      'Inter', 'Helvetica Neue', Arial, sans-serif;

      /* US Letter portrait at 96 DPI */
      --page-w: 816px;
      --page-h: 1056px;
      --page-pad: 48px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #222; font-family: var(--font-ui); }
    body { color: #fff; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    /* ===== Toolbar ===== */
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: #000; border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px; z-index: 200;
    }
    .toolbar .brand {
      font-family: var(--font-display); font-size: 13px;
      letter-spacing: .25em; text-transform: uppercase; color: #fff;
    }
    .toolbar .brand small {
      display: block; font-family: var(--font-ui); font-size: 9px;
      letter-spacing: .2em; color: #b8b8b8; font-weight: 500; margin-top: 2px;
    }
    .toolbar .spacer { flex: 1; }
    .tb-btn {
      font-family: var(--font-ui); font-size: 11px; text-transform: uppercase; letter-spacing: .15em;
      padding: 9px 16px; cursor: pointer;
      border: 1px solid #fff; background: #fff; color: #000;
      font-weight: 600; text-decoration: none; display: inline-block;
    }
    .tb-btn:hover { opacity: .85; }
    .tb-btn.ghost { background: transparent; color: #fff; }
    .tb-btn:disabled { opacity: .4; cursor: default; }
    .tb-status { font-size: 10px; color: #b8b8b8; text-transform: uppercase; letter-spacing: .15em; }
    .tb-status.ok { color: #9ec39e; }
    .tb-status.err { color: #d99; }

    /* ===== Page canvas (US Letter) ===== */
    .stage {
      padding: 80px 20px 60px;
      display: flex; justify-content: center;
    }
    .page {
      width: var(--page-w);
      min-height: var(--page-h);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      padding: var(--page-pad);
      box-shadow: 0 4px 24px rgba(0,0,0,.5);
    }

    /* ===== Header ===== */
    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 18px; border-bottom: 1px solid var(--rule);
      margin-bottom: 24px;
    }
    .page-head .brand-left {
      display: flex; align-items: center; gap: 14px;
    }
    .page-head .co {
      font-family: var(--font-display);
      font-size: 15px; letter-spacing: .28em; text-transform: uppercase;
    }
    .page-head .co small {
      display: block; font-family: var(--font-body);
      font-size: 8.5px; letter-spacing: .22em; color: var(--ink-muted);
      font-weight: 600; margin-top: 3px; text-transform: uppercase;
    }
    .page-head .arch { width: 40px; height: 40px; object-fit: contain; }
    .page-head .doc-title {
      text-align: right; font-family: var(--font-display);
      font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    }
    .page-head .doc-title small {
      display: block; font-family: var(--font-body); font-size: 8px;
      letter-spacing: .16em; color: var(--ink-muted); font-weight: 600;
      margin-top: 3px; text-transform: uppercase;
    }

    /* ===== Property block ===== */
    .prop-block { margin-bottom: 22px; }
    .prop-eyebrow {
      font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--ink-muted); font-weight: 700; margin-bottom: 4px;
    }
    .prop-title {
      font-family: var(--font-display); font-size: 24px;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink); margin: 0 0 8px; line-height: 1.15;
    }
    .prop-subtitle {
      font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--ink-muted); font-weight: 600;
    }

    /* ===== Info grid ===== */
    .info-grid {
      display: grid; grid-template-columns: 2fr 1fr; gap: 20px;
      margin-bottom: 22px;
      padding: 18px; border: 1px solid var(--rule); background: #fafafa;
    }
    .info-col h3 {
      font-family: var(--font-display); font-size: 9px;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--ink-muted); margin: 0 0 8px; font-weight: 400;
    }
    .info-field { margin-bottom: 10px; font-size: 12px; }
    .info-field .lbl {
      display: block;
      font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--ink-soft); font-weight: 700; margin-bottom: 2px;
    }
    .info-field .val { color: var(--ink); font-weight: 500; }
    .info-field .val.big {
      font-family: var(--font-display); font-size: 20px;
      letter-spacing: .04em;
    }
    .stage-badge {
      display: inline-block; padding: 5px 12px; font-size: 10px;
      font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      background: var(--ink); color: #fff;
      margin-bottom: 8px;
    }

    /* ===== Section titles ===== */
    h2.section {
      font-family: var(--font-display); font-size: 11px;
      letter-spacing: .22em; text-transform: uppercase;
      margin: 22px 0 10px;
      padding-bottom: 5px; border-bottom: 1px solid var(--rule);
    }

    /* ===== Timeline ===== */
    .timeline { margin-bottom: 4px; }
    .tl-row {
      display: grid; grid-template-columns: 130px 1fr 90px;
      gap: 12px; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--rule-light);
    }
    .tl-row:last-child { border-bottom: 0; }
    .tl-label {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--ink); font-weight: 700;
    }
    .tl-label small {
      display: block; font-family: var(--font-body); font-size: 9.5px;
      letter-spacing: .06em; color: var(--ink-muted); font-weight: 500;
      text-transform: none; margin-top: 2px;
    }
    .tl-track {
      position: relative; height: 8px; background: #ececec;
      border-radius: 4px; overflow: hidden;
    }
    .tl-track .tl-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: var(--ink);
    }
    .tl-row.done .tl-fill    { background: var(--ok); }
    .tl-row.past .tl-fill    { background: var(--err); }
    .tl-row.approaching .tl-fill { background: var(--warn); }
    .tl-status {
      text-align: right; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; font-weight: 700; color: var(--ink-muted);
    }
    .tl-row.done .tl-status    { color: var(--ok); }
    .tl-row.past .tl-status    { color: var(--err); }
    .tl-row.approaching .tl-status { color: var(--warn); }

    /* ===== Cards for closing / inspection ===== */
    .card-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 4px;
    }
    .card-block {
      border: 1px solid var(--rule); padding: 14px 16px; background: #fafafa;
    }
    .card-block h4 {
      font-family: var(--font-display); font-size: 9px;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--ink-muted); margin: 0 0 10px;
    }
    .card-block .row { font-size: 11.5px; margin-bottom: 8px; }
    .card-block .lbl {
      display: block;
      font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-soft); font-weight: 700; margin-bottom: 2px;
    }
    .card-block .val { color: var(--ink); }
    .card-block .note {
      font-size: 9.5px; color: var(--ink-muted); font-style: italic;
      margin-top: 3px; letter-spacing: .02em;
    }

    /* ===== Notes / footer ===== */
    .notes-block {
      padding: 12px 16px; background: #fafafa; border: 1px solid var(--rule);
      font-size: 11.5px; line-height: 1.55;
      white-space: pre-wrap; color: var(--ink);
    }
    .page-foot {
      margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; align-items: flex-end;
      font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .page-foot .agent { color: var(--ink); }
    .page-foot .agent b { font-weight: 700; }

    /* ===== Empty / loading state ===== */
    .empty, .loading {
      padding: 60px 20px; text-align: center;
      color: var(--ink-muted); font-size: 13px; line-height: 1.6;
    }
    .empty h2, .loading h2 {
      font-family: var(--font-display); font-size: 16px;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--ink); margin: 0 0 12px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="brand">Victory Formation Ventures <small id="tb-sub">Transaction Report</small></div>
    <div class="spacer"></div>
    <span class="tb-status" id="status"></span>
    <button class="tb-btn" id="download-btn" type="button" disabled>Download PDF</button>
    <a class="tb-btn ghost" href="index.html">← Dashboard</a>
  </div>

  <div class="stage">
    <div class="page" id="page">
      <div class="loading" id="loading">
        <h2>Preparing Report</h2>
        <p>Loading deal data…</p>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================
       Transaction Report generator
       Reads deal from URL: ?address=1234+Main+St&type=buyer|listing
       Fetches the matching Google Sheet, finds the row, renders
       a Victory Formation-branded one-page report, auto-downloads PDF.
       ===================================================== */

    /* ---- Sheet configs (mirror index.html) ---- */
    const CONFIGS = {
      buyer: {
        SHEET_ID:  "1gnS-0j8wgLYpHMmHhKDRu7FKzY7LS9m0iywv0OAjpys",
        SHEET_TAB: "Form Responses 1",
        LABEL: 'Buyer Representation',
        DOC: 'Transaction Update'
      },
      listing: {
        SHEET_ID:  "15AjfNcJHfIWtXbvFxadMwuZQRBKWjLYEuV-x_jObzi4",
        SHEET_TAB: "Form Responses 1",
        LABEL: 'Listing Representation',
        DOC: 'Listing Update'
      }
    };

    const AGENT = {
      name:  'Gabe Jeudy-Lally',
      phone: '(737) 600-5101',
      email: 'gvjbusiness@yahoo.com',
      brokerage: 'Victory Formation Ventures'
    };

    /* ---- Helpers (mirror the dashboard's _ad* helpers) ---- */
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const usd = new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits: 0 });
    function fmtUSD(n) { return isFinite(n) && n ? usd.format(n) : '—'; }
    function fmtDate(d) {
      if (!(d instanceof Date) || isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function daysBetween(a, b) {
      if (!a || !b) return 0;
      return Math.round((b.getTime() - a.getTime()) / 86400000);
    }
    function parseGvizString(cell) {
      if (!cell) return '';
      if (cell.f != null) return String(cell.f);
      if (cell.v != null) return String(cell.v);
      return '';
    }
    function parseGvizNumber(cell) {
      if (!cell || cell.v == null) return 0;
      if (typeof cell.v === 'number') return cell.v;
      const n = parseFloat(String(cell.v).replace(/[$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function parseGvizDate(cell) {
      if (!cell || cell.v == null) return null;
      const v = cell.v;
      if (v instanceof Date) return v;
      if (typeof v === 'string' && /^Date\(/.test(v)) {
        const m = v.match(/Date\((\d+),(\d+),(\d+)/);
        if (m) return new Date(+m[1], +m[2], +m[3]);
      }
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function parseGvizEnvelope(text) {
      const m = text.match(/setResponse\(([\s\S]+)\)\s*;?\s*$/);
      if (!m) throw new Error('gviz response format unexpected');
      const data = JSON.parse(m[1]);
      if (data.status !== 'ok') throw new Error('gviz: ' + (data.errors?.[0]?.detailed_message || data.status));
      return data.table || { cols: [], rows: [] };
    }
    function findCol(cols, ...candidates) {
      const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
      const labels = cols.map(c => norm(c.label));
      for (const cand of candidates) {
        const t = norm(cand);
        const i = labels.findIndex(l => l === t);
        if (i >= 0) return i;
      }
      for (const cand of candidates) {
        const t = norm(cand);
        const i = labels.findIndex(l => l.indexOf(t) >= 0 || t.indexOf(l) >= 0);
        if (i >= 0) return i;
      }
      return -1;
    }

    /* ---- Bar-complete state (matches dashboard localStorage) ---- */
    function isComplete(address, label) {
      try {
        return localStorage.getItem(
          'vfv.dealComplete:' + String(address || '').toLowerCase().trim() + ':' + String(label).toLowerCase().trim()
        ) === '1';
      } catch (_) { return false; }
    }

    /* ---- URL params ---- */
    const params = new URLSearchParams(location.search);
    const type = (params.get('type') || 'buyer').toLowerCase();
    const address = (params.get('address') || '').trim();
    const cfg = CONFIGS[type];

    /* ---- Boot ---- */
    (async function boot() {
      const pageEl = document.getElementById('page');
      const statusEl = document.getElementById('status');
      const downloadBtn = document.getElementById('download-btn');
      document.getElementById('tb-sub').textContent = cfg ? cfg.DOC : 'Transaction Report';

      if (!cfg || !address) {
        pageEl.innerHTML = '<div class="empty"><h2>Missing parameters</h2><p>Open this report from a deal card on the dashboard. The link must include <code>?address=…&type=buyer</code> or <code>&type=listing</code>.</p></div>';
        return;
      }

      statusEl.textContent = 'Loading deal…';

      let deal;
      try {
        deal = await loadDeal(cfg, address, type);
      } catch (err) {
        console.error(err);
        pageEl.innerHTML = '<div class="empty"><h2>Could not load</h2><p>' + esc(err.message || err) + '</p></div>';
        statusEl.className = 'tb-status err';
        statusEl.textContent = 'Error';
        return;
      }
      if (!deal) {
        pageEl.innerHTML = '<div class="empty"><h2>Deal not found</h2><p>No row in the sheet matches: <strong>' + esc(address) + '</strong>.<br>The address must match exactly (case-insensitive).</p></div>';
        return;
      }

      renderReport(pageEl, deal, type);
      statusEl.className = 'tb-status ok';
      statusEl.textContent = 'Loaded';
      downloadBtn.disabled = false;
      downloadBtn.addEventListener('click', () => downloadPdf(deal));

      // Auto-download on load — matches Gabe's request for "direct PDF"
      setTimeout(() => downloadPdf(deal), 500);
    })();

    /* ---- Load + dedupe (mirror dashboard parser) ---- */
    async function loadDeal(cfg, addr, type) {
      const url = 'https://docs.google.com/spreadsheets/d/' + cfg.SHEET_ID +
        '/gviz/tq?tqx=out:json&headers=1&sheet=' + encodeURIComponent(cfg.SHEET_TAB) +
        '&t=' + Date.now();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const table = parseGvizEnvelope(await res.text());
      const cols = table.cols || [];
      const rows = table.rows || [];

      const ix = commonIx(cols, type);
      if (ix.address < 0) throw new Error('Sheet missing Property Address column');

      const parsed = rows.map(r => rowToObj(r, ix, type)).filter(d => d.address);

      // Dedupe by address — latest Timestamp wins
      const byAddr = new Map();
      const key = a => (a || '').trim().toLowerCase();
      parsed.forEach(d => {
        const k = key(d.address);
        const ex = byAddr.get(k);
        if (!ex) { byAddr.set(k, d); return; }
        const dt = d.timestamp?.getTime?.() || 0;
        const et = ex.timestamp?.getTime?.() || 0;
        if (dt >= et) byAddr.set(k, d);
      });
      return byAddr.get(key(addr));
    }

    function commonIx(cols, type) {
      const ix = {
        timestamp: findCol(cols, 'Timestamp'),
        address:   findCol(cols, 'Property Address'),
        agent:     findCol(cols, 'Agent', 'Listing Agent', 'Victory Formation Agent'),
        stage:     findCol(cols, 'Stage', 'Current Stage'),
        closing:   findCol(cols, 'Closing Date', 'Closing'),
        dateUC:    findCol(cols, 'Date Under Contract', 'Under Contract'),
        notes:     findCol(cols, 'Notes'),
      };
      if (type === 'buyer') {
        Object.assign(ix, {
          client:            findCol(cols, 'Client', 'Buyer', 'Client Name'),
          listingAgent:      findCol(cols, 'Listing Agent'),
          listingBrokerage:  findCol(cols, 'Listing Brokerage'),
          contractPrice:     findCol(cols, 'Contract Price', 'Price'),
          earnestMoney:      findCol(cols, 'Earnest Money'),
          emDue:             findCol(cols, 'Earnest Money Due', 'Earnest Money Deadline'),
          inspectionEnd:     findCol(cols, 'Inspection Period Ends', 'Inspection Period End', 'Inspection End'),
          resolutionEnd:     findCol(cols, 'Resolution Period Ends', 'Resolution Period End'),
          ddEnd:             findCol(cols, 'Due Diligence End', 'DD End'),
          finalWalk:         findCol(cols, 'Final Walkthrough', 'Final Walk Through', 'Final Walk-Through'),
          blueTape:          findCol(cols, 'Blue Tape Walkthrough', 'Blue Tape Walk-Through'),
          closingCompany:    findCol(cols, 'Closing Company'),
          closingAttorney:   findCol(cols, 'Closing Attorney'),
          closingAttorneyPhone: findCol(cols, 'Closing Attorney Phone'),
          closingLocation:   findCol(cols, 'Closing Company Location'),
          inspectionCompany: findCol(cols, 'Inspection Company'),
          inspectionDate:    findCol(cols, 'Date of Inspection', 'Inspection Date'),
          appraisalDate:     findCol(cols, 'Date of Appraisal', 'Appraisal Date')
        });
      } else {
        Object.assign(ix, {
          seller:      findCol(cols, 'Seller', 'Seller Name'),
          listPrice:   findCol(cols, 'List Price', 'Price'),
          listDate:    findCol(cols, 'List Date'),
          soldPrice:   findCol(cols, 'Sold Price'),
          buyerAgent:  findCol(cols, "Buyer's Agent", 'Buyer Agent')
        });
      }
      return ix;
    }

    function rowToObj(r, ix, type) {
      const c = r.c || [];
      const g = (i) => (i >= 0 ? c[i] : null);
      const base = {
        timestamp: parseGvizDate(g(ix.timestamp)),
        address:   parseGvizString(g(ix.address)),
        agent:     parseGvizString(g(ix.agent)),
        stage:     parseGvizString(g(ix.stage)),
        closing:   parseGvizDate(g(ix.closing)),
        dateUC:    parseGvizDate(g(ix.dateUC)),
        notes:     parseGvizString(g(ix.notes))
      };
      if (type === 'buyer') {
        Object.assign(base, {
          client:            parseGvizString(g(ix.client)),
          listingAgent:      parseGvizString(g(ix.listingAgent)),
          listingBrokerage:  parseGvizString(g(ix.listingBrokerage)),
          contractPrice:     parseGvizNumber(g(ix.contractPrice)),
          earnestMoney:      parseGvizNumber(g(ix.earnestMoney)),
          emDue:             parseGvizDate(g(ix.emDue)),
          inspectionEnd:     parseGvizDate(g(ix.inspectionEnd)),
          resolutionEnd:     parseGvizDate(g(ix.resolutionEnd)),
          ddEnd:             parseGvizDate(g(ix.ddEnd)),
          finalWalk:         parseGvizDate(g(ix.finalWalk)),
          blueTape:          parseGvizDate(g(ix.blueTape)),
          closingCompany:    parseGvizString(g(ix.closingCompany)),
          closingAttorney:   parseGvizString(g(ix.closingAttorney)),
          closingAttorneyPhone: parseGvizString(g(ix.closingAttorneyPhone)),
          closingLocation:   parseGvizString(g(ix.closingLocation)),
          inspectionCompany: parseGvizString(g(ix.inspectionCompany)),
          inspectionDate:    parseGvizDate(g(ix.inspectionDate)),
          appraisalDate:     parseGvizDate(g(ix.appraisalDate))
        });
      } else {
        Object.assign(base, {
          seller:      parseGvizString(g(ix.seller)),
          listPrice:   parseGvizNumber(g(ix.listPrice)),
          listDate:    parseGvizDate(g(ix.listDate)),
          soldPrice:   parseGvizNumber(g(ix.soldPrice)),
          buyerAgent:  parseGvizString(g(ix.buyerAgent))
        });
      }
      return base;
    }

    /* ---- Render ---- */
    function renderReport(pageEl, d, type) {
      pageEl.innerHTML = type === 'buyer' ? renderBuyer(d) : renderListing(d);
    }

    function tlRow(label, start, end, today, address, subtitle) {
      if (!start || !end) return '';
      const total = Math.max(1, daysBetween(start, end));
      const elapsed = Math.max(0, Math.min(total, daysBetween(start, today)));
      const remaining = daysBetween(today, end);
      const pct = (elapsed / total) * 100;
      const complete = isComplete(address, label);
      let cls = '';
      let statusText;
      if (complete) { cls = 'done'; statusText = '✓ Complete'; }
      else if (remaining < 0)    { cls = 'past';        statusText = Math.abs(remaining) + ' day' + (Math.abs(remaining)===1?'':'s') + ' past'; }
      else if (remaining === 0)  { cls = 'approaching'; statusText = 'Today'; }
      else if (remaining <= 7)   { cls = 'approaching'; statusText = remaining + ' day' + (remaining===1?'':'s') + ' left'; }
      else                       {                       statusText = remaining + ' days left'; }
      const fill = complete ? 100 : pct;
      const sub = fmtDate(end) + (subtitle ? ' · ' + subtitle : '');
      return `
        <div class="tl-row ${cls}">
          <div class="tl-label">${esc(label)}<small>${esc(sub)}</small></div>
          <div class="tl-track"><div class="tl-fill" style="width:${fill.toFixed(1)}%"></div></div>
          <div class="tl-status">${esc(statusText)}</div>
        </div>
      `;
    }

    function renderBuyer(d) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const timelineRows = [
        tlRow('Earnest Money',     d.dateUC, d.emDue,         today, d.address),
        tlRow('Inspection Period', d.dateUC, d.inspectionEnd || d.ddEnd, today, d.address),
        tlRow('Resolution Period', d.dateUC, d.resolutionEnd, today, d.address),
        tlRow('Closing',           d.dateUC, d.closing,       today, d.address)
      ].filter(Boolean).join('');

      const inspAppr = [];
      if (d.inspectionCompany) inspAppr.push(`<div class="row"><span class="lbl">Inspector</span><span class="val">${esc(d.inspectionCompany)}</span></div>`);
      if (d.inspectionDate)    inspAppr.push(`<div class="row"><span class="lbl">Inspection</span><span class="val">${esc(fmtDate(d.inspectionDate))}</span></div>`);
      if (d.appraisalDate)     inspAppr.push(`<div class="row"><span class="lbl">Appraisal</span><span class="val">${esc(fmtDate(d.appraisalDate))}</span></div>`);
      if (d.finalWalk)         inspAppr.push(`<div class="row"><span class="lbl">Final Walk</span><span class="val">${esc(fmtDate(d.finalWalk))}</span></div>`);
      if (d.blueTape)          inspAppr.push(`<div class="row"><span class="lbl">Blue Tape</span><span class="val">${esc(fmtDate(d.blueTape))}</span></div>`);

      // (Closing block now built inline below with EM-holder note)

      // Closing block — flag the closing company as the EM holder when both are set
      const closingBlock = [];
      if (d.closingCompany) {
        let val = `<span class="val">${esc(d.closingCompany)}</span>`;
        if (d.earnestMoney) {
          val += `<div class="note">Also holds the earnest money deposit${d.earnestMoney ? ' of ' + esc(fmtUSD(d.earnestMoney)) : ''}</div>`;
        }
        closingBlock.push(`<div class="row"><span class="lbl">Company</span>${val}</div>`);
      }
      if (d.closingAttorney) closingBlock.push(`<div class="row"><span class="lbl">Attorney</span><span class="val">${esc(d.closingAttorney)}${d.closingAttorneyPhone ? ' — ' + esc(d.closingAttorneyPhone) : ''}</span></div>`);
      if (d.closingLocation) closingBlock.push(`<div class="row"><span class="lbl">Location</span><span class="val">${esc(d.closingLocation)}</span></div>`);

      return `
        <div class="page-head">
          <div class="brand-left">
            <img class="arch" src="assets/icon-arch-black.png" alt="" />
            <div class="co">Victory Formation Ventures<small>Buyer Representation</small></div>
          </div>
          <div class="doc-title">Transaction Update<small>${esc(fmtDate(today))}</small></div>
        </div>

        <div class="prop-block">
          <div class="prop-eyebrow">Property under contract</div>
          <h1 class="prop-title">${esc(d.address)}</h1>
          <div class="prop-subtitle">${esc(d.client || 'Buyer')} · Victory Formation Agent: ${esc(d.agent || AGENT.name)}</div>
        </div>

        <div class="info-grid">
          <div class="info-col">
            <h3>Deal Snapshot</h3>
            <div class="info-field"><span class="lbl">Contract Price</span><span class="val big">${esc(fmtUSD(d.contractPrice))}</span></div>
            <div class="info-field"><span class="lbl">Earnest Money</span><span class="val">${esc(fmtUSD(d.earnestMoney))}</span></div>
            <div class="info-field"><span class="lbl">Under Contract</span><span class="val">${esc(fmtDate(d.dateUC) || '—')}</span></div>
            <div class="info-field"><span class="lbl">Est. Closing</span><span class="val">${esc(fmtDate(d.closing) || '—')}</span></div>
          </div>
          <div class="info-col">
            <h3>Status</h3>
            <div class="stage-badge">${esc(d.stage || 'Under Contract')}</div>
            ${d.listingAgent ? `<div class="info-field"><span class="lbl">Listing Agent</span><span class="val">${esc(d.listingAgent)}</span></div>` : ''}
            ${d.listingBrokerage ? `<div class="info-field"><span class="lbl">Brokerage</span><span class="val">${esc(d.listingBrokerage)}</span></div>` : ''}
          </div>
        </div>

        <h2 class="section">Timeline &amp; Milestones</h2>
        <div class="timeline">${timelineRows}</div>

        ${(inspAppr.length || closingBlock.length) ? `
          <h2 class="section">Third-Party Coordination</h2>
          <div class="card-grid">
            ${inspAppr.length ? `<div class="card-block"><h4>Inspection &amp; Appraisal</h4>${inspAppr.join('')}</div>` : ''}
            ${closingBlock.length ? `<div class="card-block"><h4>Closing</h4>${closingBlock.join('')}</div>` : ''}
          </div>
        ` : ''}

        ${d.notes ? `<h2 class="section">Notes</h2><div class="notes-block">${esc(d.notes)}</div>` : ''}

        <div class="page-foot">
          <div class="agent">
            <b>${esc(d.agent || AGENT.name)}</b> · ${esc(AGENT.brokerage)}<br>
            ${esc(AGENT.phone)} · ${esc(AGENT.email)}
          </div>
          <div>Prepared ${esc(fmtDate(today))}</div>
        </div>
      `;
    }

    function renderListing(d) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dom = d.listDate ? Math.max(0, daysBetween(d.listDate, d.stage === 'Closed' && d.closing ? d.closing : today)) : null;
      const timelineRows = [
        tlRow('Under Contract', d.listDate, d.dateUC,  today, d.address, 'Executed contract date'),
        tlRow('Closing',        d.dateUC || d.listDate, d.closing, today, d.address)
      ].filter(Boolean).join('');

      const showSold = d.soldPrice && /^closed$/i.test(d.stage);

      return `
        <div class="page-head">
          <div class="brand-left">
            <img class="arch" src="assets/icon-arch-black.png" alt="" />
            <div class="co">Victory Formation Ventures<small>Listing Representation</small></div>
          </div>
          <div class="doc-title">Listing Update<small>${esc(fmtDate(today))}</small></div>
        </div>

        <div class="prop-block">
          <div class="prop-eyebrow">Listing status</div>
          <h1 class="prop-title">${esc(d.address)}</h1>
          <div class="prop-subtitle">${esc(d.seller || 'Seller')} · Victory Formation Agent: ${esc(d.agent || AGENT.name)}</div>
        </div>

        <div class="info-grid">
          <div class="info-col">
            <h3>Listing Snapshot</h3>
            <div class="info-field"><span class="lbl">List Price</span><span class="val big">${esc(fmtUSD(d.listPrice))}</span></div>
            <div class="info-field"><span class="lbl">List Date</span><span class="val">${esc(fmtDate(d.listDate) || '—')}</span></div>
            <div class="info-field"><span class="lbl">Days on Market</span><span class="val">${dom == null ? '—' : dom + ' day' + (dom === 1 ? '' : 's')}</span></div>
            ${showSold ? `<div class="info-field"><span class="lbl">Sold Price</span><span class="val big">${esc(fmtUSD(d.soldPrice))}</span></div>` : ''}
          </div>
          <div class="info-col">
            <h3>Status</h3>
            <div class="stage-badge">${esc(d.stage || 'Active')}</div>
            ${d.buyerAgent ? `<div class="info-field"><span class="lbl">Buyer's Agent</span><span class="val">${esc(d.buyerAgent)}</span></div>` : ''}
            ${d.dateUC ? `<div class="info-field"><span class="lbl">Under Contract</span><span class="val">${esc(fmtDate(d.dateUC))}</span></div>` : ''}
            ${d.closing ? `<div class="info-field"><span class="lbl">Closing Date</span><span class="val">${esc(fmtDate(d.closing))}</span></div>` : ''}
          </div>
        </div>

        ${timelineRows ? `<h2 class="section">Timeline</h2><div class="timeline">${timelineRows}</div>` : ''}

        ${d.notes ? `<h2 class="section">Notes</h2><div class="notes-block">${esc(d.notes)}</div>` : ''}

        <div class="page-foot">
          <div class="agent">
            <b>${esc(d.agent || AGENT.name)}</b> · ${esc(AGENT.brokerage)}<br>
            ${esc(AGENT.phone)} · ${esc(AGENT.email)}
          </div>
          <div>Prepared ${esc(fmtDate(today))}</div>
        </div>
      `;
    }

    /* ---- PDF download (html2canvas → pdf-lib) ---- */
    async function downloadPdf(deal) {
      const btn = document.getElementById('download-btn');
      const stat = document.getElementById('status');
      btn.disabled = true;
      stat.className = 'tb-status';
      stat.textContent = 'Rendering PDF…';
      try {
        const pageEl = document.getElementById('page');
        const canvas = await html2canvas(pageEl, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });
        const imgBytes = await (await fetch(canvas.toDataURL('image/jpeg', 0.92))).arrayBuffer();
        const { PDFDocument } = PDFLib;
        const pdfDoc = await PDFDocument.create();
        const page = pdfDoc.addPage([612, 792]); // US Letter in points
        const jpg = await pdfDoc.embedJpg(imgBytes);
        // Fit to page while preserving aspect ratio
        const scale = Math.min(612 / jpg.width, 792 / jpg.height);
        const w = jpg.width * scale;
        const h = jpg.height * scale;
        page.drawImage(jpg, { x: (612 - w)/2, y: (792 - h)/2, width: w, height: h });
        const bytes = await pdfDoc.save();
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const slug = String(deal.address || 'deal').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        a.href = url;
        a.download = 'vfv-transaction-' + slug + '.pdf';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        stat.className = 'tb-status ok';
        stat.textContent = '✓ Downloaded';
      } catch (err) {
        console.error(err);
        stat.className = 'tb-status err';
        stat.textContent = 'PDF error — see console';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
