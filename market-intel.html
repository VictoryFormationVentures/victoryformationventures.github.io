<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Market Intel · Victory Formation Ventures</title>
  <meta name="theme-color" content="#f6f2ea" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-arch-transparent.png" />

  <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Mulish:wght@200;300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f2ea; --bg-elev: #fbf9f4; --panel: #fbf9f4; --panel-edge: #d9d0bf;
      --rule: #d9d0bf; --rule-strong: #c9bfab; --text: #111111; --text-muted: #5a564e;
      --text-dim: #8a8579; --accent: #8a7a4b; --soft: #f1ece2; --soft2: #ede7da;
      --good: #3f7a3f; --bad: #b03030;
      --font-body: 'Mulish', 'Helvetica Neue', Arial, sans-serif;
      --font-display: 'Aboreto', 'Cormorant Garamond', serif;
      --font-ui: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button { font: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ==================== Top bar (matches land.html) ==================== */
    .topbar { position: sticky; top: 0; z-index: 50; background: #f6f2ea; border-bottom: 1px solid var(--panel-edge); display: flex; align-items: center; gap: 22px; padding: 20px 28px; }
    .topbar .brand { display: flex; align-items: center; gap: 20px; }
    .topbar .brand img.arch { width: 60px; height: 60px; object-fit: contain; background: transparent; }
    .topbar .brand .name { font-family: var(--font-display); font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: #111111; }
    .topbar .brand .name small { display: block; font-family: var(--font-body); font-size: 9px; letter-spacing: .28em; color: var(--text-dim); font-weight: 600; margin-top: 4px; }
    .topbar .spacer { flex: 1; }
    .topbar .parent-link { font-family: var(--font-body); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted); padding: 6px 12px; border: 1px solid var(--panel-edge); background: transparent; cursor: pointer; }
    .topbar .parent-link:hover { color: #111111; border-color: #111111; }

    /* ==================== Layout ==================== */
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 100px); }
    .sidenav { background: #fbf9f4; border-right: 1px solid var(--panel-edge); padding: 22px 18px; position: sticky; top: 100px; height: calc(100vh - 100px); overflow-y: auto; }
    .sidenav .section-label { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin: 4px 0 10px; }
    .sidenav .nav-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text-muted); font-family: var(--font-body); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 10px 12px; margin: 2px 0; cursor: pointer; }
    .sidenav .nav-item:hover { color: #111111; background: var(--soft); }
    .sidenav .nav-item.is-active { color: #111111; background: var(--soft); border-left: 2px solid var(--accent); padding-left: 10px; }
    .sidenav .nav-item small { float: right; color: var(--text-dim); letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .sidenav .nav-group { margin: 12px 0 4px; }
    .sidenav .nav-group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; color: var(--text-muted); user-select: none; }
    .sidenav .nav-group > summary::-webkit-details-marker { display: none; }
    .sidenav .nav-group > summary::after { content: '＋'; color: var(--text-dim); font-size: 12px; }
    .sidenav .nav-group[open] > summary::after { content: '−'; }
    .sidenav .nav-group > .nav-item { padding-left: 26px; }
    .sidenav .nav-group > .nav-item.is-active { padding-left: 24px; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .sidenav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--panel-edge); display: flex; flex-wrap: wrap; gap: 2px; padding: 12px; }
      .sidenav .section-label { width: 100%; }
      .sidenav .nav-item { width: auto; padding: 8px 10px; font-size: 11px; }
      .sidenav .nav-item small { display: none; }
      .sidenav .nav-group { display: contents; }
      .sidenav .nav-group > summary { display: none; }
      .topbar { padding: 14px 16px; gap: 12px; }
      .topbar .brand .name { font-size: 15px; letter-spacing: .2em; }
      .topbar .brand img.arch { width: 42px; height: 42px; }
    }

    /* ==================== Content ==================== */
    .content { padding: 40px 48px 80px; max-width: 1500px; }
    @media (max-width: 860px) { .content { padding: 24px 16px 60px; } }
    .division-eyebrow { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin-bottom: 10px; }
    h1.division-title { font-family: var(--font-display); font-size: 52px; letter-spacing: .12em; text-transform: uppercase; color: #111111; margin: 0 0 14px; font-weight: 400; line-height: 1; }
    h1.division-title small { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: .3em; color: var(--text-muted); font-weight: 500; margin-top: 14px; text-transform: uppercase; }
    @media (max-width: 860px) { h1.division-title { font-size: 32px; } }
    .panel { display: none; margin-top: 8px; }
    .panel.is-active { display: block; }
    .panel-intro { font-size: 13px; line-height: 1.6; color: var(--text-muted); max-width: 720px; margin: 0 0 22px; }
    .toolrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 20px; }
    .search { flex: 1 1 260px; max-width: 420px; font-family: var(--font-body); font-size: 13px; padding: 10px 12px; background: var(--panel); color: #111111; border: 1px solid var(--rule-strong); }
    .search:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
    .btn { font-family: var(--font-body); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; padding: 10px 22px; cursor: pointer; background: var(--accent); color: #f6f2ea; border: 1px solid var(--accent); transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn.ghost { background: transparent; color: #111111; border-color: var(--panel-edge); }
    .btn.ghost:hover { border-color: #111111; }
    .btn.on { background: #111111; border-color: #111111; color: #f6f2ea; }
    .btn.sm { padding: 6px 12px; font-size: 9.5px; letter-spacing: .16em; }

    /* Stat tiles (matches land overview tiles) */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .pl-tile { padding: 20px 22px; background: var(--panel); border: 1px solid var(--rule); }
    .pl-tile .k { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
    .pl-tile .v { font-family: var(--font-display); font-size: 30px; color: #111111; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .pl-tile .s { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Research cards */
    .research-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 480px) { .research-grid { grid-template-columns: 1fr; } }
    .research-card { background: var(--panel); border: 1px solid var(--rule); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .research-card.pri { border-left: 3px solid var(--accent); }
    .research-card h3 { font-family: var(--font-display); font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: #111111; font-weight: 400; margin: 0; line-height: 1.4; }
    .research-card.pri h3 { color: var(--accent); }
    .who { font-size: 12px; color: var(--text-muted); }
    .why { font-size: 12.5px; line-height: 1.6; color: var(--text); margin: 0; }
    .meta { font-size: 11.5px; line-height: 1.55; color: var(--text-muted); margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--text-dim); padding: 3px 8px; background: var(--soft); border: 1px solid var(--rule); }
    .tag.spec { color: var(--accent); border-color: var(--accent); background: transparent; }
    .tag.pri { color: #f6f2ea; background: var(--accent); border-color: var(--accent); }
    .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .lnk { font-family: var(--font-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; padding: 6px 10px; border: 1px solid var(--panel-edge); color: #111111; background: transparent; }
    .lnk:hover { border-color: #111111; }
    .lnk.ig { background: #111111; color: #f6f2ea; border-color: #111111; }
    .lnk.ig:hover { opacity: .8; }
    .lnk.ig.unv { background: transparent; color: #111111; border-style: dashed; }
    .empty { color: var(--text-dim); padding: 24px 0; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }

    /* Pricing bands */
    .band { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .band { grid-template-columns: 1fr; } }
    .band > div { background: var(--soft); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border: 1px solid var(--rule); }
    .band .lbl { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
    .band b { font-family: var(--font-display); font-size: 17px; color: #111111; font-weight: 400; font-variant-numeric: tabular-nums; }
    .band .sub { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

    /* Events */
    .ev { display: grid; grid-template-columns: 96px 1fr; gap: 14px; background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px; margin-bottom: 8px; }
    .ev.star { border-left: 3px solid var(--accent); }
    .ev .d { font-family: var(--font-display); font-size: 13px; line-height: 1.3; color: var(--accent); }
    .ev .d small { display: block; font-family: var(--font-body); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; margin-top: 2px; }
    .ev h3 { font-family: var(--font-body); font-size: 13px; font-weight: 700; margin: 0 0 3px; color: #111111; }
    .ev p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.55; }

    /* Tables */
    .tblh { font-family: var(--font-display); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; margin: 26px 0 10px; font-weight: 400; }
    .tblwrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--panel); }
    .research-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 860px; }
    .research-table th { text-align: left; padding: 8px 10px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; border-bottom: 1px solid var(--rule); background: var(--soft); }
    .research-table td { padding: 7px 10px; border-bottom: 1px solid var(--soft2); color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .research-table td:first-child { color: #111111; font-weight: 600; }
    .research-table td:nth-child(2) { white-space: normal; min-width: 220px; }
    .research-table a { color: var(--accent); }

    /* Follow list */
    .follow { background: var(--panel); border: 1px solid var(--rule); padding: 16px 18px; margin-bottom: 12px; }
    .follow h3 { font-family: var(--font-display); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 400; margin: 0 0 4px; }
    .follow p { margin: 0 0 12px; font-size: 11.5px; color: var(--text-muted); }
    .handles { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Playbook blurbs */
    .research-blurb { font-size: 12.5px; line-height: 1.65; color: var(--text-muted); max-width: 760px; }
    .research-blurb p { margin: 0 0 12px; }
    .research-blurb b { color: var(--text); font-weight: 600; }
    .blurb-card { background: var(--panel); border: 1px solid var(--rule); padding: 20px 22px; margin-bottom: 14px; }
    .blurb-card h2 { font-family: var(--font-display); font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 400; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }

    /* Proforma */
    .pfwrap { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 900px) { .pfwrap { grid-template-columns: 360px 1fr; } }
    .pfin { background: var(--panel); border: 1px solid var(--rule); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-self: start; }
    .fld { display: grid; grid-template-columns: 1fr 110px 44px; align-items: center; gap: 8px; font-size: 12px; }
    .fld span { color: var(--text-muted); }
    .fld input, .fld select { font-family: var(--font-body); font-size: 13px; padding: 7px 9px; background: #f6f2ea; color: #111111; border: 1px solid var(--rule-strong); width: 100%; font-variant-numeric: tabular-nums; text-align: right; }
    .fld select { grid-column: 2 / 4; text-align: left; }
    .fld input:focus, .fld select:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
    .fld em { font-style: normal; font-size: 10px; color: var(--text-dim); }
    .pfout { background: var(--panel); border: 1px solid var(--rule); padding: 18px; }
    .big { padding: 16px 18px; margin-bottom: 14px; border-left: 3px solid var(--text-dim); background: var(--soft); }
    .big.good { border-color: var(--good); } .big.ok { border-color: var(--accent); } .big.bad { border-color: var(--bad); }
    .big span { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; display: block; }
    .big b { font-family: var(--font-display); font-size: 30px; font-weight: 400; line-height: 1.1; display: block; margin: 4px 0; font-variant-numeric: tabular-nums; color: #111111; }
    .big small { font-size: 12px; color: var(--text-muted); }
    .pft { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .pft td { padding: 7px 0; border-bottom: 1px solid var(--soft2); color: var(--text-muted); }
    .pft td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #111111; }
    .pft tr.sub td { font-weight: 700; color: #111111; border-bottom: 2px solid var(--rule-strong); }
    .research-note { font-size: 10.5px; color: var(--text-dim); font-style: italic; line-height: 1.5; margin: 12px 0 0; }
  </style>
</head>

lots: [
{n:"How $1M+ teardown lots really trade here",who:"Read this first",t:["lots","pri"],hood:"Tarrytown, Westlake, Pemberton, Zilker, Bouldin, Barton Hills",why:"None of the verifiable Austin wholesalers advertise Tarrytown or Westlake teardowns. Their inventory is sub-$600K distressed houses in South and East Austin and the suburbs. Luxury lots move through agent pocket listings (Austin Luxury Network carried about 400 properties at $1.5M+, roughly 30% as many as the MLS), builders' own acquisition teams, direct mail to long-tenure owners, probate, and demolition-permit watching. Spend 70% of your time on agents and your own mail program, 20% on probate and permit data, 10% on wholesaler lists.",meta:"Texas Property Code 5.086 requires wholesalers to disclose they are assigning a contract, not conveying title. Insist on it and on a title company that handles assignments."},
{n:"Austin Luxury Network (ALN)",who:"Agent-only private listing platform since 2011",t:["lots","pri"],hood:"$1.5M+ pocket listings citywide",why:"Where Tarrytown, Westlake and Pemberton pocket listings, including teardowns, actually circulate. You can't join as a buyer; you get in through a member agent, or your own Texas license.",meta:"",web:"austinluxurynetwork.com"},
{n:"Commission.co The Clubhouse",who:"Justin and Alissa Shapiro (co-founders)",t:["lots","pri"],hood:"Austin, agent-only",why:"Agents post buyer needs here. A partner agent can broadcast 'builder client seeking 78703 or 78746 teardown, 0.25+ acre, cash, 21-day close' to every top agent in town.",meta:"Requires an active Texas license",web:"commission.co/the-clubhouse"},

{n:"Hill Country acreage brokers",who:"Capitol Ranch Real Estate · Republic Ranches · Legacy Broker Group · Texas Alliance of Land Brokers directory",t:["lots"],hood:"Dripping Springs, Bee Cave, Spicewood, Lake Travis",why:"For 1 to 10 acre estate lots west of town. Capitol Ranch has an Austin office (855-968-1200). The TALB member search is the fastest way to find a Dripping Springs specialist.",meta:"",web:"texaslandbrokers.org/members/search-members"},
{n:"Direct-to-seller mail program",who:"Your own pipeline",t:["lots","pri"],hood:"78703, 78746, 78704, 78731, 78756",why:"Pull TCAD for pre-1970 homes on 0.25+ acre lots with 20+ year tenure, no homestead exemption, or out-of-state mailing address. Tools: PropStream, DealMachine or Privy for skip tracing. Builders Land Source says it outright: most prime Texas land never hits the MLS.",meta:""},

function card(o){
  const chips=(o.t||[]).map(k=>`<span class="tag ${k}">${CHIP[k]||k}</span>`).join("");
  const links=[];
  if(o.ig) links.push(`<a class="lnk ig${o.igu?' unv':''}" href="https://www.instagram.com/${esc(o.ig)}/" target="_blank" rel="noopener">@${esc(o.ig)}</a>`);
  if(o.ig2) links.push(`<a class="lnk ig" href="https://www.instagram.com/${esc(o.ig2)}/" target="_blank" rel="noopener">@${esc(o.ig2)}</a>`);
  if(o.web) links.push(`<a class="lnk" href="https://${esc(o.web)}" target="_blank" rel="noopener">${esc(o.web)}</a>`);
  return `<article class="research-card${(o.t||[]).includes("pri")?" pri":""}">
    <div class="tags">${chips}</div>
    <h3>${esc(o.n)}</h3>
    ${o.who?`<div class="who">${esc(o.who)}</div>`:""}
    ${o.hood?`<p class="meta">${esc(o.hood)}</p>`:""}
    <p class="why">${esc(o.why)}</p>
    ${o.meta?`<p class="meta">${esc(o.meta)}</p>`:""}
    ${links.length?`<div class="links">${links.join("")}</div>`:""}
  </article>`;
}

function pfCalc(p){
  const hardT=p.sqft*p.hard, softT=(hardT+p.site)*p.soft/100, cost0=p.lot+hardT+p.site+softT;
  const loan=cost0*p.ltc/100, interest=loan*(p.rate/100)*(p.months/12)*0.6, loanFees=loan*0.01;
  const gross=p.sqft*p.sale, selling=gross*0.06, closing=gross*0.01, taxIns=p.lot*0.02*(p.months/12)+15000;
  const total=cost0+interest+loanFees+taxIns, net=gross-selling-closing, profit=net-total, equity=total-loan;
  return {hardT,softT,cost0,loan,interest,loanFees,gross,selling,closing,taxIns,total,net,profit,equity,margin:profit/gross,roe:profit/equity,annROE:profit/equity*(12/p.months),breakeven:(total+closing)/(0.94*p.sqft)};
}
function proformaView(){

  const good=r.margin>=0.18, ok=r.margin>=0.12;
  return `<p class="panel-intro">Quick spec underwriting. Pick a preset that matches the tier, then change any number. Costs are September 2026 Austin ranges (luxury hard costs $450 to $600+/sf, semi-custom $325 to $450); every field is an assumption to replace with real bids. Interest assumes an average 60% draw. Selling costs 6%, closing 1%, 1% loan fee, taxes and insurance during the hold.</p>
  <div class="pfwrap"><div class="pfin">
    <label class="fld"><span>Preset</span><select id="pf_preset">${Object.entries(PRESETS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("")}</select></label>
    ${f("lot","Lot price",10000,"$")}${f("sqft","Finished sq ft",50,"sf")}${f("hard","Hard cost per sf",5,"$/sf")}${f("site","Site work, demo, utilities",5000,"$")}${f("soft","Soft costs",1,"% hard")}${f("months","Months lot to close",1,"mo")}${f("ltc","Loan to cost",5,"%")}${f("rate","Interest rate",0.25,"%")}${f("sale","Sale price per sf",10,"$/sf")}
   </div><div class="pfout">
    <div class="big ${good?"good":ok?"ok":"bad"}"><span>Projected profit</span><b>${fmt(r.profit)}</b><small>${(r.margin*100).toFixed(1)}% margin on sale · ${(r.roe*100).toFixed(0)}% on equity (${(r.annROE*100).toFixed(0)}% annualized)</small></div>
    <table class="pft">
     <tr><td>Sale price</td><td>${fmt(r.gross)}</td></tr><tr><td>Less commissions and closing (7%)</td><td>(${fmt(r.selling+r.closing)})</td></tr><tr class="sub"><td>Net proceeds</td><td>${fmt(r.net)}</td></tr>
     <tr><td>Lot</td><td>${fmt(pf.lot)}</td></tr><tr><td>Hard construction</td><td>${fmt(r.hardT)}</td></tr><tr><td>Site work</td><td>${fmt(pf.site)}</td></tr><tr><td>Soft costs</td><td>${fmt(r.softT)}</td></tr><tr><td>Interest and loan fee</td><td>${fmt(r.interest+r.loanFees)}</td></tr><tr><td>Taxes, insurance, misc carry</td><td>${fmt(r.taxIns)}</td></tr><tr class="sub"><td>All-in cost</td><td>${fmt(r.total)}</td></tr>
     <tr><td>Cash equity needed (${100-pf.ltc}% of cost)</td><td>${fmt(r.equity)}</td></tr><tr><td>All-in cost per sf</td><td>${fmt(r.total/pf.sqft)}</td></tr><tr><td>Breakeven sale price per sf</td><td>${fmt(r.breakeven)}</td></tr><tr><td>Lot as % of sale</td><td>${(pf.lot/r.gross*100).toFixed(0)}%</td></tr>
    </table>
    <p class="research-note">Nashville rule still holds: if the lot is more than 35% of the exit, or breakeven $/sf is within 10% of the tier's ask, walk. For a full model use the Underwriting Model in Admin.</p>
   </div></div>`;
}
function bindProforma(root){
  const sel=root.querySelector("#pf_preset"); if(!sel) return;
